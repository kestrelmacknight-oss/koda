<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#09090F">
  <title>Page Not Found — Koda</title>
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="nav scrolled" id="kp-nav" role="navigation" aria-label="Main navigation">
  <div class="nav-inner">
    <a href="/" class="nav-logo" aria-label="Koda home">
      <div class="nav-mark" aria-hidden="true">K</div>
      <span class="nav-name">Koda</span>
    </a>
    <div class="nav-ctas">
      <a href="/" class="btn btn-ghost">Go home</a>
      <a href="/#download" class="btn btn-primary">Download Alpha</a>
    </div>
  </div>
</nav>

<main class="not-found" id="main-content">
  <div class="not-found-inner">
    <div class="not-found-glow" aria-hidden="true" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);width:600px;height:400px;background:radial-gradient(ellipse,rgba(123,104,238,.1) 0%,transparent 70%);pointer-events:none;"></div>
    <div class="code" aria-label="Error 404">404</div>
    <h1>Page not found</h1>
    <p>The page you&rsquo;re looking for doesn&rsquo;t exist, was moved, or the link was incorrect.</p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <a href="/" class="btn btn-primary">Back to home</a>
      <a href="/#download" class="btn btn-ghost">Download Koda</a>
    </div>
  </div>
</main>

<script src="/js/main.js" defer></script>
</body>
</html>
